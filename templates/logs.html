<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Telemetry — {{printer_ip}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/logs_style.css">
</head>
<body>

    <div class="container">
        <!-- Top Status & Header -->
        <div class="header">
            <div class="title-group">
                <h1>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                    Execution Telemetry
                    <span class="target-ip">{{printer_ip}}</span>
                </h1>
                <p>Live stdout/stderr stream from automated deployment session</p>
            </div>

            <div class="header-actions">
                <button type = "button" id = "action-btn"  onclick="stopExecution()" class="btn-nav">
                    Stop Execution
                </button>
                <div class="status-badge">
                    <div class="status-dot"></div>
                    STREAM ACTIVE
                </div>
            </div>
        </div>

        <!-- Terminal Console Frame -->
        <div class="terminal-box">
            <div class="terminal-bar">
                <div class="window-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>
                <div class="terminal-controls">
                    <button class="terminal-btn active" id="btn-scroll" onclick="toggleAutoScroll()">
                        ⬇ Auto-Scroll: ON
                    </button>
                    <button class="terminal-btn" onclick="copyLogs()">
                        📋 Copy
                    </button>
                </div>
            </div>

            <!-- Preformatted Logs Console -->
            <pre id="logs"><span style="color: #64748b;">Status: Syncing...</span></pre>
        </div>
    </div>

    <script>
    let autoScroll = true;
    let jobCompleted = false;

    function checkStatus() {

    fetch("/status")
    .then(response => response.text())
    .then(status => {

        if (status === "COMPLETED" && !jobCompleted) {

            jobCompleted = true;

            const actionBtn =
                document.getElementById("action-btn");

            actionBtn.innerHTML =
                '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> New Job';

            actionBtn.onclick = function () {
                window.history.back();
            };
        }

    });
}
        function stopExecution() {

    fetch('/stop', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            printer_ip: "{{ printer_ip }}"
        })
    })
}



        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            const btn = document.getElementById("btn-scroll");
            if (autoScroll) {
                btn.classList.add("active");
                btn.textContent = "⬇ Auto-Scroll: ON";
                const logDiv = document.getElementById("logs");
                logDiv.scrollTop = logDiv.scrollHeight;
            } else {
                btn.classList.remove("active");
                btn.textContent = "⏸ Auto-Scroll: OFF";
            }
        }

        function copyLogs() {
            const text = document.getElementById("logs").innerText;
            navigator.clipboard.writeText(text).then(() => {
                const counter = document.getElementById("byte-counter");
                const originalText = counter.textContent;
                counter.textContent = "Copied to clipboard!";
                counter.style.color = "var(--success)";
                setTimeout(() => {
                    counter.textContent = originalText;
                    counter.style.color = "#64748b";
                }, 1800);
            });
        }

        function loadLogs() {
    fetch("/logs")
    .then(response => response.text())
    .then(data => {

        let logDiv = document.getElementById("logs");

        if (data.trim().length > 0) {
            logDiv.innerHTML = data;
        }

        if (data.includes("__COMPLETED__")) {

    clearInterval(logPoller);

    const actionBtn = document.getElementById("action-btn");

    actionBtn.innerHTML =
        '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> New Job';

    actionBtn.onclick = function () {
        window.history.back();
    };
}

        if (autoScroll) {
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    });
}

        // Initial fetch and 1-second interval loop
        loadLogs();
        const logPoller = setInterval(loadLogs, 1000);
        setInterval(checkStatus, 1000);
    </script>
</body>
</html>
