<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWS Automation Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/index_style.css">

</head>
<body>

    <div class="container">
        <!-- Top Tech Header -->
        <div class="header">
            <div class="title-group">
                <h1>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    EWS Automation
                </h1>
                <p>Embedded Web Server Configuration Orchestrator</p>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                READY
            </div>
        </div>

        <!-- Mode Buttons (Updates hidden select) -->
        <div class="mode-selector">
            <button type="button" class="mode-btn active" id="btn-choice-1" onclick="selectChoice('1')">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                EWS Config
            </button>
            <button type="button" class="mode-btn" id="btn-choice-2" onclick="selectChoice('2')">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                Change Password
            </button>
        </div>

        <!-- Form preserving all original names and POST action -->
        <form action="/run" method="post" id="ews-form">

            <!-- Hidden original select to guarantee 100% backend compatibility -->
            <select name="choice" id="choice" style="display: none;" onchange="toggleFields()">
                <option value="1">EWS Configuration</option>
                <option value="2">Change Password</option>
            </select>

            <div class="form-grid">
                <!-- Common Field 1: Printer IP -->
                <div class="input-group">
                    <label for="printer_ip">Printer IP Address</label>
                    <div class="input-wrapper">
                        <input type="text" id="printer_ip" name="printer_ip" placeholder="192.168.1.100" required>
                    </div>
                </div>

                <!-- Common Field 2: Password -->
                <div class="input-group">
                    <label for="password">Device Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('password')">👁</button>
                    </div>
                </div>

                <!-- DYNAMIC SECTION 1: EWS FIELDS -->
                <div id="ews-fields" class="field-section">
                    <div class="input-group full-width">
                        <label for="domain">Target Domain</label>
                        <div class="input-wrapper">
                            <input type="text" id="domain" name="domain" placeholder="domain.com">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="ip1">Server IP</label>
                        <div class="input-wrapper">
                            <input type="text" id="ip1" name="ip1" placeholder="10.0.0.50">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="fax_number">Fax Number</label>
                        <div class="input-wrapper">
                            <input type="text" id="fax_number" name="fax_number" placeholder="987654">
                        </div>
                    </div>
                </div>

                <!-- DYNAMIC SECTION 2: PASSWORD FIELDS -->
                <div id="password-fields" class="field-section hidden">
                    <div class="input-group">
                        <label for="old_password">Old Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="old_password" name="old_password" placeholder="••••••••">
                            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('old_password')">👁</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="new_password">New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="new_password" name="new_password" placeholder="••••••••">
                            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('new_password')">👁</button>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Run Button -->
            <button type="submit" class="btn-submit" id="submit-btn">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                EXECUTE AUTOMATION
            </button>
        </form>
    </div>

    <script>
        // Synchronize custom tab buttons with the backend select element
        function selectChoice(val) {
            document.getElementById("choice").value = val;
            toggleFields();
        }

        function toggleFields() {
            let choice = document.getElementById("choice").value;
            let ewsFields = document.getElementById("ews-fields");
            let pwdFields = document.getElementById("password-fields");
            let btn1 = document.getElementById("btn-choice-1");
            let btn2 = document.getElementById("btn-choice-2");
            let taskLabel = document.getElementById("current-task-label");

            if (choice === "1") {
                ewsFields.classList.remove("hidden");
                pwdFields.classList.add("hidden");
                btn1.classList.add("active");
                btn2.classList.remove("active");
                taskLabel.textContent = "task::ews_configure";
            } else {
                ewsFields.classList.add("hidden");
                pwdFields.classList.remove("hidden");
                btn1.classList.remove("active");
                btn2.classList.add("active");
                taskLabel.textContent = "task::rotate_password";
            }
        }

        // Toggle password show/hide functionality
        function togglePasswordVisibility(fieldId) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        // // Visual feedback when launching automation
        // document.getElementById("ews-form").addEventListener("submit", function() {
        //     const btn = document.getElementById("submit-btn");
        //     btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> DISPATCHING BOT...`;
        //     btn.style.opacity = "0.75";
        //     btn.style.pointerEvents = "none";
        // });

        // Initialize state on load
        window.onload = toggleFields;
    </script>
</body>
</html>
